<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviveAI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span>R</span>
        <div>
          <strong>ReviveAI</strong>
          <small>Revenue Recovery</small>
        </div>
      </div>
      <nav>
        <button class="active">Dashboard</button>
        <button>Risk Queue</button>
        <button>Audit</button>
        <button>Evaluation</button>
      </nav>
      <div class="policy">
        <small>Policy Guardrails</small>
        <p>Max amount: INR 10,000</p>
        <p>Max retries: 2</p>
        <p>Cooldown: 30 min</p>
        <p>Opt-out: blocked</p>
      </div>
    </aside>

    <main>
      <header>
        <div>
          <p class="eyebrow">Track 03 - AI Revenue Recovery</p>
          <h1>Recover failed revenue with bounded AI workflows</h1>
        </div>
        <div class="actions">
          <button id="run-batch">Run Batch</button>
          <button id="reset">Reset Demo</button>
        </div>
      </header>

      <section class="metrics" id="metrics"></section>

      <section class="demo-strip">
        <button data-demo="DEMO_SUCCESS">Demo Success</button>
        <button data-demo="DEMO_BLOCKED">Demo Policy Block</button>
        <button data-demo="DEMO_FAIL7">Demo Provider Failure</button>
      </section>

      <section class="workbench">
        <div class="queue">
          <div class="section-title">
            <h2>At-Risk Payment Queue</h2>
            <span id="queue-count"></span>
          </div>
          <div id="cases"></div>
        </div>

        <div class="detail">
          <div class="section-title">
            <h2>Recovery Console</h2>
            <span id="selected-id"></span>
          </div>
          <div id="detail"></div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
